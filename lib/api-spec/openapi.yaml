openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shopify
    description: ATM Apparel storefront, cart, and Shopify-hosted checkout
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shopify/collections:
    get:
      operationId: listShopifyCollections
      tags: [shopify]
      summary: List storefront collections
      responses:
        "200":
          description: Available collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopifyCollection"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/products:
    get:
      operationId: listShopifyProducts
      tags: [shopify]
      summary: List or search storefront products
      parameters:
        - name: collection
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopifyProduct"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/products/{handle}:
    get:
      operationId: getShopifyProduct
      tags: [shopify]
      summary: Get a storefront product
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyProduct"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/carts:
    post:
      operationId: createShopifyCart
      tags: [shopify]
      summary: Create a Shopify cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartInput"
      responses:
        "201":
          description: Shopify cart created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCart"
        "502":
          description: Shopify cart could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/carts/{cartId}:
    get:
      operationId: getShopifyCart
      tags: [shopify]
      summary: Get a Shopify cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCart"
        "404":
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/carts/{cartId}/lines:
    post:
      operationId: addShopifyCartLine
      tags: [shopify]
      summary: Add a variant to a Shopify cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartLineInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCart"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/carts/{cartId}/lines/{lineId}:
    patch:
      operationId: updateShopifyCartLine
      tags: [shopify]
      summary: Update a Shopify cart line quantity
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartLineUpdate"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCart"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeShopifyCartLine
      tags: [shopify]
      summary: Remove a line from a Shopify cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCart"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ShopifyMoney:
      type: object
      properties:
        amount:
          type: string
        currencyCode:
          type: string
      required: [amount, currencyCode]
    ShopifyImage:
      type: object
      properties:
        url:
          type: string
        altText:
          type: ["string", "null"]
      required: [url, altText]
    ShopifyOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    ShopifyVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        availableForSale:
          type: boolean
        price:
          $ref: "#/components/schemas/ShopifyMoney"
        compareAtPrice:
          anyOf:
            - $ref: "#/components/schemas/ShopifyMoney"
            - type: "null"
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOption"
      required: [id, title, availableForSale, price, compareAtPrice, selectedOptions]
    ShopifyProduct:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        productType:
          type: string
        tags:
          type: array
          items:
            type: string
        availableForSale:
          type: boolean
        featuredImage:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyVariant"
      required: [id, handle, title, description, productType, tags, availableForSale, featuredImage, images, variants]
    ShopifyCollection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        handle:
          type: string
        description:
          type: string
        image:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
      required: [id, title, handle, description, image]
    ShopifyCartLine:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: integer
        merchandiseId:
          type: string
        variantTitle:
          type: string
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOption"
        price:
          $ref: "#/components/schemas/ShopifyMoney"
        availableForSale:
          type: boolean
        productId:
          type: string
        productHandle:
          type: string
        productTitle:
          type: string
        image:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
      required: [id, quantity, merchandiseId, variantTitle, selectedOptions, price, availableForSale, productId, productHandle, productTitle, image]
    ShopifyCart:
      type: object
      properties:
        id:
          type: string
        checkoutUrl:
          type: string
        totalQuantity:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyCartLine"
        subtotal:
          $ref: "#/components/schemas/ShopifyMoney"
        total:
          $ref: "#/components/schemas/ShopifyMoney"
      required: [id, checkoutUrl, totalQuantity, lines, subtotal, total]
    ShopifyCartLineInput:
      type: object
      properties:
        merchandiseId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [merchandiseId, quantity]
    ShopifyCartInput:
      type: object
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShopifyCartLineInput"
      required: [lines]
    ShopifyCartLineUpdate:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [quantity]

